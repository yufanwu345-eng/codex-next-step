<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Codex Next Step promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fff8ee"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font-family:"Segoe UI",Arial,sans-serif;font-weight:800;fill:#0f172a}
      .subtitle{font-family:"Segoe UI",Arial,sans-serif;font-weight:600;fill:#2563eb}
      .body{font-family:"Segoe UI",Arial,sans-serif;fill:#475569}
      .small{font-family:"Segoe UI",Arial,sans-serif;fill:#64748b}
      .card-title{font-family:"Segoe UI",Arial,sans-serif;font-weight:700;fill:#111827}
      .mono{font-family:"Cascadia Mono","Consolas",monospace;fill:#334155}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="140" r="170" fill="#dbeafe" opacity="0.45"/>
  <circle cx="1260" cy="760" r="220" fill="#dcfce7" opacity="0.36"/>
  <circle cx="370" cy="740" r="190" fill="#eff6ff" opacity="0.72"/>

  <text x="90" y="130" class="title" font-size="82">Codex Next Step</text>
  <text x="92" y="200" class="subtitle" font-size="42">Keep Codex in flow</text>
  <text x="94" y="270" class="body" font-size="27">Deliver results, choose the next move, and keep building.</text>
  <text x="94" y="318" class="body" font-size="27">A smooth next-step prompt loop for long Codex sessions.</text>

  <g filter="url(#soft)" transform="translate(95 405)">
    <rect x="0" y="0" width="220" height="220" rx="34" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="54" y="48" width="108" height="108" rx="30" fill="#f8fafc" stroke="#bfdbfe" stroke-width="6"/>
    <rect x="82" y="68" width="20" height="20" rx="3" fill="#0f172a"/>
    <rect x="124" y="68" width="20" height="20" rx="3" fill="#0f172a"/>
    <rect x="88" y="112" width="58" height="12" rx="6" fill="#22c55e"/>
    <rect x="64" y="160" width="128" height="22" rx="8" fill="#1e293b"/>
    <text x="36" y="205" class="small" font-size="20">friendly flow helper</text>
  </g>

  <g filter="url(#shadow)" transform="translate(520 170)">
    <rect width="610" height="520" rx="30" fill="#ffffff" stroke="#dbeafe"/>
    <rect width="610" height="72" rx="30" fill="#f8fafc"/>
    <circle cx="42" cy="36" r="10" fill="#ff5f57"/>
    <circle cx="72" cy="36" r="10" fill="#ffbd2e"/>
    <circle cx="102" cy="36" r="10" fill="#28c840"/>
    <text x="230" y="45" class="card-title" font-size="24">下一步选项</text>

    <text x="52" y="120" class="card-title" font-size="29">选择下一步，继续进入心流</text>
    <text x="52" y="158" class="small" font-size="20">Multi-select actions, type a custom instruction, or attach images.</text>

    <g transform="translate(52 198)">
      <rect width="300" height="52" rx="15" fill="#f8fbff" stroke="#bfdbfe"/>
      <rect x="18" y="15" width="22" height="22" rx="6" fill="url(#blue)"/>
      <path d="M23 26 l7 7 l15 -17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="58" y="34" class="body" font-size="22">Check current status</text>

      <rect y="70" width="300" height="52" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="18" y="85" width="22" height="22" rx="6" fill="#fff" stroke="#cbd5e1"/>
      <text x="58" y="104" class="body" font-size="22">Continue editing</text>

      <rect y="140" width="300" height="52" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="18" y="155" width="22" height="22" rx="6" fill="#fff" stroke="#cbd5e1"/>
      <text x="58" y="174" class="body" font-size="22">Run checks</text>
    </g>

    <g transform="translate(370 198)">
      <rect width="158" height="192" rx="18" fill="#f8fbff" stroke="#93c5fd" stroke-dasharray="8 8"/>
      <text x="32" y="92" class="subtitle" font-size="22">Paste</text>
      <text x="35" y="122" class="small" font-size="18">Ctrl+V</text>
      <rect x="48" y="32" width="62" height="46" rx="10" fill="#dbeafe"/>
      <path d="M58 62 l18 -18 l16 16 l10 -9 l0 21 l-44 0z" fill="#3b82f6"/>
    </g>

    <rect x="52" y="415" width="420" height="56" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="72" y="451" class="small" font-size="20">输入其他下一步任务...</text>
    <rect x="488" y="415" width="72" height="56" rx="16" fill="url(#blue)"/>
    <text x="505" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">继续</text>
  </g>

  <g filter="url(#soft)" transform="translate(1185 160)">
    <rect width="300" height="96" rx="24" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="28" y="24" width="50" height="50" rx="14" fill="url(#blue)"/>
    <path d="M40 50 l11 11 l23 -27" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="98" y="45" class="card-title" font-size="23">Multi-select</text>
    <text x="98" y="70" class="small" font-size="17">Pick several directions</text>
  </g>

  <g filter="url(#soft)" transform="translate(1185 290)">
    <rect width="300" height="96" rx="24" fill="#ffffff" stroke="#ccfbf1"/>
    <rect x="28" y="24" width="50" height="50" rx="14" fill="url(#green)"/>
    <text x="42" y="59" font-family="Consolas,monospace" font-size="32" font-weight="700" fill="#fff">&gt;_</text>
    <text x="98" y="45" class="card-title" font-size="23">Custom input</text>
    <text x="98" y="70" class="small" font-size="17">Say exactly what is next</text>
  </g>

  <g filter="url(#soft)" transform="translate(1185 420)">
    <rect width="300" height="180" rx="24" fill="#fffaf0" stroke="#fed7aa"/>
    <text x="26" y="42" class="card-title" font-size="23">Structured JSON</text>
    <text x="28" y="78" class="mono" font-size="17">{</text>
    <text x="50" y="105" class="mono" font-size="16">&quot;status&quot;: &quot;submitted&quot;,</text>
    <text x="50" y="132" class="mono" font-size="16">&quot;selected&quot;: [...],</text>
    <text x="50" y="159" class="mono" font-size="16">&quot;custom_answer&quot;: &quot;...&quot;</text>
  </g>

  <g transform="translate(110 735)">
    <rect width="330" height="86" rx="24" fill="#ffffff" stroke="#dbeafe" filter="url(#soft)"/>
    <text x="32" y="36" class="card-title" font-size="24">1. Deliver result</text>
    <text x="32" y="62" class="small" font-size="18">The agent finishes the current task.</text>
  </g>
  <path d="M455 778 C520 748 610 748 675 778" fill="none" stroke="#3b82f6" stroke-width="5" stroke-dasharray="12 12"/>
  <path d="M675 778 l-18 -10 l0 20 z" fill="#3b82f6"/>
  <g transform="translate(690 735)">
    <rect width="330" height="86" rx="24" fill="#ffffff" stroke="#bfdbfe" filter="url(#soft)"/>
    <text x="32" y="36" class="card-title" font-size="24">2. Ask next step</text>
    <text x="32" y="62" class="small" font-size="18">The user picks where to go.</text>
  </g>
  <path d="M1035 778 C1100 748 1190 748 1255 778" fill="none" stroke="#14b8a6" stroke-width="5" stroke-dasharray="12 12"/>
  <path d="M1255 778 l-18 -10 l0 20 z" fill="#14b8a6"/>
  <g transform="translate(1270 735)">
    <rect width="310" height="86" rx="24" fill="#ffffff" stroke="#bbf7d0" filter="url(#soft)"/>
    <text x="32" y="36" class="card-title" font-size="24">3. Keep working</text>
    <text x="32" y="62" class="small" font-size="18">Codex reads JSON and continues.</text>
  </g>

  <text x="610" y="862" class="subtitle" font-size="30">Stay in flow. Ship more.</text>
</svg>
